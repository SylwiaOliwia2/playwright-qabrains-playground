name: Playwright tests for QA Brains

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'test_qabrains.py'
      - '.github/workflows/test_qabrains.yml'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'conftest.py'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'test_qabrains.py'
      - '.github/workflows/test_qabrains.yml'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'conftest.py'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: playwright install --with-deps

    - name: Run QA Brains tests
      run: |
        pytest test_qabrains.py -v
      env:
        X_API_KEY: ${{ secrets.X_API_KEY }}

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          report.html
          .pytest_cache/
        retention-days: 7
